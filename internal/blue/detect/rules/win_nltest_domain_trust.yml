title: Domain Trust Discovery via Nltest
id: tyto-blue-0010
status: experimental
description: >
  nltest.exe enumerating domain trusts or domain controllers (/domain_trusts,
  /dclist, /all_trusts). Common post-exploitation reconnaissance before lateral
  movement across trust boundaries.
author: tyto blue
level: medium
references:
  - https://attack.mitre.org/techniques/T1482/
tags:
  - attack.discovery
  - attack.t1482
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
    Image|endswith: '\nltest.exe'
  selection_flags:
    CommandLine|contains:
      - '/domain_trusts'
      - '/all_trusts'
      - '/dclist'
  condition: selection_img and selection_flags
