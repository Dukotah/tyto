id: exposed-git-config
info:
  name: Exposed .git/config
  severity: high
  description: Version-control metadata is publicly readable, exposing repository structure and possibly remote URLs.
requests:
  - method: GET
    path:
      - "{{BaseURL}}/.git/config"
    matchers-condition: and
    matchers:
      - type: status
        status: [200]
      - type: word
        part: body
        words: ["[core]", "repositoryformatversion"]
        condition: or
