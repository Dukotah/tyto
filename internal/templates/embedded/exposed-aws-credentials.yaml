id: exposed-aws-credentials
info:
  name: Exposed AWS Credentials File
  severity: high
  description: An AWS credentials file is publicly readable, exposing access key IDs and secret access keys.
requests:
  - method: GET
    path:
      - "{{BaseURL}}/.aws/credentials"
    matchers-condition: and
    matchers:
      - type: status
        status: [200]
      - type: regex
        part: body
        regex:
          - "(?i)(aws_access_key_id|aws_secret_access_key|\\[default\\])"
        condition: or
