id: exposed-wpconfig-bak
info:
  name: Exposed wp-config.php Backup
  severity: high
  description: A backup copy of wp-config.php is served as plain text, disclosing WordPress database credentials and authentication salts.
requests:
  - method: GET
    path:
      - "{{BaseURL}}/wp-config.php.bak"
      - "{{BaseURL}}/wp-config.php~"
      - "{{BaseURL}}/wp-config.php.save"
      - "{{BaseURL}}/wp-config.php.old"
    matchers-condition: and
    matchers:
      - type: status
        status: [200]
      - type: word
        part: body
        words: ["DB_PASSWORD", "DB_NAME", "AUTH_KEY"]
        condition: or
