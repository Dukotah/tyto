# GoReleaser v2 configuration for tyto.
# Docs: https://goreleaser.com
version: 2

project_name: tyto

before:
  hooks:
    - go mod download

builds:
  - id: tyto
    main: ./cmd/tyto
    binary: tyto
    env:
      - CGO_ENABLED=0
    # Reproducible-ish builds: pin the binary timestamp to the commit time.
    mod_timestamp: "{{ .CommitTimestamp }}"
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/dukotah/tyto/pkg/version.Version={{ .Version }}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: tyto
    ids:
      - tyto
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- .Arch }}
    formats:
      - tar.gz
    # Use zip for Windows.
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - LICENSE*
      - NOTICE*
      - README*
      - docs/INSTALL.md

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot-{{ .ShortCommit }}"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "Merge pull request"
      - "Merge branch"

release:
  draft: false
  prerelease: auto
